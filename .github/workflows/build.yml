name: macOS build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make build SIGN_IDENTITY=-
      - run: codesign --verify --strict build/RimeScreenWords.app
